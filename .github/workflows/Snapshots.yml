name: Snapshot Data Feeds

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshots
  cancel-in-progress: true

jobs:
  build-snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate snapshots
        env:
          REPO: Ivan09069/echoforge
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const OUTDIR = path.join(process.cwd(), 'data');
          fs.mkdirSync(OUTDIR, { recursive: true });

          const REPO = process.env.REPO;

          async function fetchJson(url, opts = {}) {
            const res = await fetch(url, {
              ...opts,
              headers: {
                'Accept': 'application/vnd.github+json',
                'User-Agent': 'echoforge-snapshots',
                ...(opts.headers || {})
              }
            });
            if (!res.ok) throw new Error(`${res.status} ${res.statusText} for ${url}`);
            return res.json();
          }

          async function main() {
            const now = new Date().toISOString();

            // GitHub issues (public repo)
            const issues = await fetchJson(`https://api.github.com/repos/${REPO}/issues?state=open&sort=created&per_page=20`);

            // Snapshot proposals
            const snapshot = await fetch('https://hub.snapshot.org/graphql', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                query: `{ proposals(first: 20, where: { state: "active" }, orderBy: "created", orderDirection: desc) {
                  id title end votes scores_total space { id name avatar } choices scores
                }}`
              })
            }).then(r => r.json());

            // DeFiLlama yields
            const yields = await fetchJson('https://yields.llama.fi/pools');

            // CoinGecko prices (may rate-limit; OK as snapshot)
            let prices = {};
            try {
              prices = await fetchJson('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true');
            } catch (e) {
              prices = { error: String(e) };
            }

            const payload = {
              generatedAt: now,
              repo: REPO,
              issues,
              proposals: snapshot?.data?.proposals || [],
              yields: yields?.data || [],
              prices
            };

            fs.writeFileSync(path.join(OUTDIR, 'snapshot.json'), JSON.stringify(payload, null, 2));
            fs.writeFileSync(path.join(OUTDIR, 'issues.json'), JSON.stringify({ generatedAt: now, repo: REPO, issues }, null, 2));
            console.log('Wrote data/snapshot.json and data/issues.json');
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Commit & push if changed
        run: |
          git config user.name "echoforge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || (git commit -m "chore: update snapshots" && git push)
